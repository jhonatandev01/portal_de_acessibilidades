<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Preview visual do Portal de Acessibilidade</title>
  <desc id="desc">Ilustração em SVG representando a tela inicial do portal, com hero, botao de acesso e cards de recursos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="55%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="110" r="140" fill="#dbeafe" opacity="0.8"/>
  <circle cx="170" cy="780" r="180" fill="#e0f2fe" opacity="0.65"/>

  <rect x="90" y="70" width="1420" height="760" rx="34" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="90" y="70" width="1420" height="80" rx="34" fill="#0f172a" opacity="0.96"/>
  <rect x="90" y="116" width="1420" height="34" fill="#0f172a" opacity="0.96"/>

  <text x="140" y="123" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">Portal de Acessibilidade para Todos</text>
  <text x="1400" y="123" text-anchor="end" font-family="Arial, sans-serif" font-size="18" fill="#cbd5e1">Home</text>

  <rect x="150" y="190" width="630" height="490" rx="28" fill="#ffffff"/>
  <text x="190" y="248" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#2563eb">Projeto Acadêmico · Turma B · Profª Noemi Paiva dos Santos</text>
  <text x="190" y="320" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Acessibilidade para</text>
  <text x="190" y="372" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">Todos: a web como</text>
  <text x="190" y="424" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#0f172a">direito fundamental</text>
  <text x="190" y="482" font-family="Arial, sans-serif" font-size="22" fill="#475569">Painel completo com recursos de contraste, leitura, voz e navegação acessível.</text>

  <rect x="190" y="548" width="310" height="62" rx="18" fill="url(#blue)"/>
  <text x="345" y="588" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Abrir Painel de Acessibilidade</text>

  <rect x="525" y="548" width="210" height="62" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="630" y="588" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Conhecer Recursos</text>

  <rect x="830" y="190" width="590" height="490" rx="28" fill="#0f172a"/>
  <rect x="870" y="230" width="510" height="260" rx="24" fill="#1e293b"/>
  <circle cx="1000" cy="360" r="72" fill="#93c5fd" opacity="0.9"/>
  <circle cx="1140" cy="330" r="54" fill="#fde68a" opacity="0.9"/>
  <circle cx="1230" cy="390" r="66" fill="#86efac" opacity="0.9"/>
  <rect x="870" y="520" width="510" height="130" rx="22" fill="#ffffff"/>
  <text x="900" y="565" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Universal Design & Tecnologias Assistivas</text>
  <text x="900" y="604" font-family="Arial, sans-serif" font-size="17" fill="#64748b">Seção visual do hero com imagem e texto introdutório do projeto.</text>

  <rect x="150" y="720" width="1270" height="72" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="190" y="764" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Recursos: fonte ajustável · contraste · dislexia · leitura guiada · voz · cursor ampliado · links destacados · animações reduzidas</text>
</svg>
